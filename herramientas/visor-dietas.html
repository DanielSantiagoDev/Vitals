<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor de dietas — Vitals</title>
<style>
  :root {
    --bg: #f4f6f2;
    --bg-card: #ffffff;
    --text: #232821;
    --text-muted: #676f64;
    --border: #dde3d8;
    --accent: #4f7a3a;
    --accent-soft: #e4efdc;
    --red: #ab433f;
    --red-soft: #f7e1e0;
    --shadow: 0 1px 3px rgba(30,40,25,0.09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181b17;
      --bg-card: #21251f;
      --text: #e9eee6;
      --text-muted: #9aa394;
      --border: #333a30;
      --accent: #8fc06f;
      --accent-soft: #29331f;
      --red: #d97e7a;
      --red-soft: #352222;
      --shadow: 0 1px 3px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 20px 20px 40px; }

  header { margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .subtitle { color: var(--text-muted); font-size: 13px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 16px 0 10px;
    padding: 12px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    align-items: center;
  }
  .nav-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }

  select {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    flex: 1 1 180px;
  }

  .spacer { flex: 1 1 auto; }

  #refresh-btn, .open-link {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }

  .variantes {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 14px;
  }
  [hidden] { display: none !important; }
  .variante-tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
  }
  .variante-tab:hover { border-color: var(--accent); }
  .variante-tab.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  .frame-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  #plan-frame {
    display: block;
    width: 100%;
    height: 78vh;
    min-height: 560px;
    border: none;
    background: #fff;
  }

  .empty-state, .error-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .error-state { color: var(--red); }
  .error-state code { background: var(--red-soft); padding: 2px 6px; border-radius: 5px; }

  footer { margin-top: 16px; color: var(--text-muted); font-size: 11.5px; text-align: center; }
  kbd {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
  }

  @media (max-width: 640px) {
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar select { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📅 Visor de dietas</h1>
    <div class="subtitle" id="subtitle">Cargando datos/dieta/planes/…</div>
  </header>

  <div class="toolbar" id="toolbar" hidden>
    <button class="nav-btn" id="prev-btn" title="Semana anterior">← Semana</button>
    <select id="semana-select"></select>
    <button class="nav-btn" id="next-btn" title="Semana siguiente">Semana →</button>
    <div class="spacer"></div>
    <a class="open-link" id="open-link" href="#" target="_blank" rel="noopener">↗ Abrir en pestaña</a>
    <button id="refresh-btn" title="Vuelve a listar datos/dieta/planes/">↻ Releer carpeta</button>
  </div>

  <div class="variantes" id="variantes" hidden></div>

  <div class="frame-wrap" id="frame-wrap" hidden>
    <iframe id="plan-frame" title="Plan de comidas"></iframe>
  </div>
  <div class="empty-state" id="empty" hidden>No hay planes en <code>datos/dieta/planes/</code>.</div>
  <div class="error-state" id="error" hidden></div>

  <footer id="footer" hidden></footer>
</div>

<script>
// ---------- Descubrimiento y parseo de archivos ----------
// Nombres esperados: YYYY-WNN.html  ó  YYYY-WNN-<letra>-<slug>.html
const NOMBRE_RE = /^(\d{4})-W(\d{2})(?:-([a-z])(?:-([a-z0-9]+(?:-[a-z0-9]+)*))?)?\.html$/i;

function parsearNombre(archivo) {
  const m = archivo.match(NOMBRE_RE);
  if (!m) return null;
  return {
    archivo,
    anio: m[1],
    semana: m[2],
    variante: m[3] ? m[3].toLowerCase() : null,
    slug: m[4] || null,
  };
}

function labelSlug(slug) {
  if (!slug) return '';
  return slug.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function claveSemana(v) { return `${v.anio}-W${v.semana}`; }

let SEMANAS = []; // [{clave, anio, semana, variantes: [...]}]
let idxSemana = 0;
let idxVariante = 0;

const STORAGE_KEY = 'vitals-visor-dietas-ultima';

async function cargarPlanes() {
  const subtitle = document.getElementById('subtitle');
  const errorBox = document.getElementById('error');
  errorBox.hidden = true;
  subtitle.textContent = 'Cargando datos/dieta/planes/…';
  try {
    const resp = await fetch('/api/planes?_=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const planes = (data.planes || [])
      .map(p => ({ ...p, parsed: parsearNombre(p.archivo) }))
      .filter(p => p.parsed);

    if (planes.length === 0) throw new Error('No se encontró ningún archivo .html con el patrón YYYY-WNN(-letra-slug).html');

    const grupos = new Map();
    planes.forEach(p => {
      const key = claveSemana(p.parsed);
      if (!grupos.has(key)) grupos.set(key, { clave: key, anio: p.parsed.anio, semana: p.parsed.semana, variantes: [] });
      grupos.get(key).variantes.push({ archivo: p.archivo, mtimeMs: p.mtimeMs, variante: p.parsed.variante, slug: p.parsed.slug });
    });

    grupos.forEach(g => g.variantes.sort((a, b) => (a.variante || '').localeCompare(b.variante || '')));

    SEMANAS = [...grupos.values()].sort((a, b) => {
      const na = parseInt(a.anio, 10) * 100 + parseInt(a.semana, 10);
      const nb = parseInt(b.anio, 10) * 100 + parseInt(b.semana, 10);
      return na - nb;
    });

    restaurarPosicion();
    poblarSelectSemanas();
    document.getElementById('toolbar').hidden = false;
    document.getElementById('frame-wrap').hidden = false;
    document.getElementById('footer').hidden = false;
    document.getElementById('empty').hidden = true;
    render();
  } catch (e) {
    subtitle.textContent = 'No se pudo cargar el listado de planes';
    errorBox.hidden = false;
    errorBox.innerHTML = `
      <p><strong>No se ha podido leer <code>datos/dieta/planes/</code>.</strong></p>
      <p>Este visor necesita abrirse desde un servidor local (no con doble clic al .html),
      porque el navegador bloquea listar archivos locales sueltos por seguridad.</p>
      <p>Ejecuta <code>node herramientas/servir-visor-dietas.js</code> desde la raíz del proyecto (abre el navegador solo).</p>
      <p style="font-size:11px">Detalle técnico: ${e.message}</p>
    `;
    document.getElementById('toolbar').hidden = true;
    document.getElementById('variantes').hidden = true;
    document.getElementById('frame-wrap').hidden = true;
    document.getElementById('footer').hidden = true;
  }
}

function restaurarPosicion() {
  idxSemana = 0;
  idxVariante = 0;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const ultima = JSON.parse(raw);
    const iS = SEMANAS.findIndex(s => s.clave === ultima.clave);
    if (iS === -1) return;
    idxSemana = iS;
    const iV = SEMANAS[iS].variantes.findIndex(v => v.archivo === ultima.archivo);
    idxVariante = iV === -1 ? 0 : iV;
  } catch (e) { /* localStorage no disponible: ignorar */ }
}

function guardarPosicion() {
  const semana = SEMANAS[idxSemana];
  const variante = semana.variantes[idxVariante];
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ clave: semana.clave, archivo: variante.archivo }));
  } catch (e) { /* localStorage no disponible: ignorar */ }
}

function poblarSelectSemanas() {
  const select = document.getElementById('semana-select');
  select.innerHTML = '';
  SEMANAS.forEach((s, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    const n = s.variantes.length;
    opt.textContent = `${s.anio} · Semana ${s.semana}` + (n > 1 ? ` (${n} variantes)` : '');
    select.appendChild(opt);
  });
  select.value = idxSemana;
}

function irASemana(nuevoIdx) {
  if (nuevoIdx < 0 || nuevoIdx >= SEMANAS.length) return;
  idxSemana = nuevoIdx;
  idxVariante = 0;
  render();
}

function irAVariante(nuevoIdx) {
  const semana = SEMANAS[idxSemana];
  if (nuevoIdx < 0 || nuevoIdx >= semana.variantes.length) return;
  idxVariante = nuevoIdx;
  render();
}

function render() {
  const semana = SEMANAS[idxSemana];
  const variante = semana.variantes[idxVariante];

  document.getElementById('semana-select').value = idxSemana;
  document.getElementById('prev-btn').disabled = idxSemana === 0;
  document.getElementById('next-btn').disabled = idxSemana === SEMANAS.length - 1;

  const variantesBox = document.getElementById('variantes');
  if (semana.variantes.length > 1) {
    variantesBox.hidden = false;
    variantesBox.innerHTML = '';
    semana.variantes.forEach((v, i) => {
      const tab = document.createElement('button');
      tab.className = 'variante-tab' + (i === idxVariante ? ' active' : '');
      const letra = (v.variante || '?').toUpperCase();
      const nombre = labelSlug(v.slug);
      tab.textContent = nombre ? `${letra} · ${nombre}` : letra;
      tab.addEventListener('click', () => irAVariante(i));
      variantesBox.appendChild(tab);
    });
  } else {
    variantesBox.hidden = true;
    variantesBox.innerHTML = '';
  }

  const src = './' + encodeURIComponent(variante.archivo) + '?v=' + Math.round(variante.mtimeMs || 0);
  const frame = document.getElementById('plan-frame');
  frame.src = src;
  document.getElementById('open-link').href = src;

  const subtitle = document.getElementById('subtitle');
  subtitle.textContent = `${variante.archivo} · semana ${idxSemana + 1} de ${SEMANAS.length}`;
  frame.onload = () => {
    try {
      const titulo = frame.contentDocument && frame.contentDocument.title;
      if (titulo) subtitle.textContent = `${titulo} · ${variante.archivo} · semana ${idxSemana + 1} de ${SEMANAS.length}`;
    } catch (e) { /* cross-origin improbable en local, ignorar */ }
  };

  guardarPosicion();
}

// ---------- Eventos ----------
document.getElementById('prev-btn').addEventListener('click', () => irASemana(idxSemana - 1));
document.getElementById('next-btn').addEventListener('click', () => irASemana(idxSemana + 1));
document.getElementById('semana-select').addEventListener('change', e => irASemana(parseInt(e.target.value, 10)));
document.getElementById('refresh-btn').addEventListener('click', cargarPlanes);

document.addEventListener('keydown', e => {
  if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') irASemana(idxSemana - 1);
  else if (e.key === 'ArrowRight') irASemana(idxSemana + 1);
  else if (/^[1-9]$/.test(e.key)) irAVariante(parseInt(e.key, 10) - 1);
});

document.getElementById('footer').textContent =
  'Fuente: datos/dieta/planes/, leído en vivo. ← → cambian de semana, 1-9 cambian de variante. «↻ Releer carpeta» si acabas de generar un plan nuevo.';

cargarPlanes();
</script>
</body>
</html>
